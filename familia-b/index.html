:root{

}
.site[data-b="suat"]{--deep:#0E2259;--main:#1B3A8C;--acc:#D3202F;--acct:#FFFFFF}
.site[data-b="vl"]{--deep:#0F2A57;--main:#1F4E9C;--acc:#E8A100;--acct:#14181F}

body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}

.in{max-width:1200px;margin-inline:auto;padding-inline:24px}

.mock{background:var(--mock);color:var(--mockt);font-size:13px}
.mock .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}

.menu{display:none;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.04em;background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--deep);cursor:pointer;margin-left:auto}

.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.facts{margin-top:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.22);background:color-mix(in srgb,var(--deep) 60%,transparent);backdrop-filter:blur(4px)}

section.sc{padding-block:88px}

.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.svc article{display:flex;flex-direction:column;gap:12px;min-width:0}
.svc .im{aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:var(--alt)}

.svc article:hover img{transform:scale(1.04)}
.svc h3{font-size:20px;font-weight:700;color:var(--deep);line-height:1.2}
.svc p{margin:0;color:var(--muted);font-size:15px}
.svc .by{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--main)}
.more{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--main);text-decoration:none;display:inline-flex;gap:8px;align-items:center;margin-top:auto;padding-top:4px;border-bottom:2px solid transparent;align-self:flex-start}
.more:hover{border-bottom-color:var(--acc)}
.olist{margin-top:36px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:32px}

.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:32px}
.tabs button{font:700 14px var(--display);letter-spacing:.04em;text-transform:uppercase;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:14px 18px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:baseline}

</style>
